services:
  mysql-marketplace:
    image: mysql:8.4
    container_name: marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_MARKETPLACE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_MARKETPLACE_DATABASE}
    ports:
      - "${MYSQL_MARKETPLACE_PORT}:3306"
    volumes:
      - mysql_marketplace_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_MARKETPLACE_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mysql-jobs:
    image: mysql:8.4
    container_name: jobs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_JOBS_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_JOBS_DATABASE}
    ports:
      - "${MYSQL_JOBS_PORT}:3306"
    volumes:
      - mysql_jobs_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_JOBS_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: shared-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 8s
      retries: 15
      start_period: 30s

  marketplace-backend:
    build:
      context: ${MARKETPLACE_BACKEND_PATH}
      dockerfile: ${DEPLOYMENT_DOCKERFILES_DIR}/marketplace-backend.Dockerfile
    container_name: marketplace-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_MARKETPLACE_ROOT_PASSWORD}@mysql-marketplace:3306/${MYSQL_MARKETPLACE_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_ELASTIC_SEARCH: ${ENABLE_ELASTIC_SEARCH}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ""
      ELASTICSEARCH_PASSWORD: ""
      ELASTICSEARCH_INDEX: ${MARKETPLACE_ELASTICSEARCH_INDEX}
      ELASTICSEARCH_USERS_INDEX: ${MARKETPLACE_ELASTICSEARCH_USERS_INDEX}
      ELASTICSEARCH_BLOGS_INDEX: ${MARKETPLACE_ELASTICSEARCH_BLOGS_INDEX}
      ELASTICSEARCH_ALLOW_SELF_SIGNED: "false"
      TOKEN_SECRET: ${MARKETPLACE_TOKEN_SECRET}
      FRONTEND_URL: http://localhost:${MARKETPLACE_FRONTEND_PORT}
      ADMIN_EMAIL: ${MARKETPLACE_ADMIN_EMAIL}
      ADMIN_PHONE: ${MARKETPLACE_ADMIN_PHONE}
      ADMIN_PASSWORD: ${MARKETPLACE_ADMIN_PASSWORD}
    ports:
      - "${MARKETPLACE_BACKEND_PORT}:4000"
    volumes:
      - marketplace_uploads:/app/uploads
    depends_on:
      mysql-marketplace:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8

  jobs-backend:
    build:
      context: ${JOBS_BACKEND_PATH}
      dockerfile: ${DEPLOYMENT_DOCKERFILES_DIR}/jobs-backend.Dockerfile
    container_name: jobs-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_JOBS_ROOT_PASSWORD}@mysql-jobs:3306/${MYSQL_JOBS_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_COMPATIBILITY: "8"
      JWT_SECRET: ${JOBS_JWT_SECRET}
      SOCKET_IO_ENABLED: "true"
      SOCKET_IO_CORS_ORIGIN: "*"
      QUEUE_PREFIX: ${JOBS_QUEUE_PREFIX}
    ports:
      - "${JOBS_BACKEND_PORT}:4000"
    volumes:
      - jobs_uploads:/app/uploads
    depends_on:
      mysql-jobs:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8

  marketplace-frontend:
    build:
      context: ${MARKETPLACE_FRONTEND_PATH}
      dockerfile: ${DEPLOYMENT_DOCKERFILES_DIR}/marketplace-frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:${MARKETPLACE_BACKEND_PORT}/api
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${MARKETPLACE_BACKEND_PORT}/api
        NEXT_PUBLIC_WS_URL: http://localhost:${MARKETPLACE_BACKEND_PORT}
        NEXT_PUBLIC_SOCKET_URL: http://localhost:${MARKETPLACE_BACKEND_PORT}
        NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH: ${ENABLE_ELASTIC_SEARCH}
        BLOG_ORIGIN: ${BLOG_ORIGIN}
        MARKETPLACE_ORIGIN: ${MARKETPLACE_ORIGIN}
    container_name: marketplace-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${MARKETPLACE_FRONTEND_PORT}:3000"
    volumes:
      - marketplace_theme_data:/app/.data
    depends_on:
      marketplace-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 8

  jobs-frontend:
    build:
      context: ${JOBS_FRONTEND_PATH}
      dockerfile: ${DEPLOYMENT_DOCKERFILES_DIR}/jobs-frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:${JOBS_BACKEND_PORT}
        NEXT_PUBLIC_API_HOST: http://localhost:${JOBS_BACKEND_PORT}
    container_name: jobs-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://jobs-backend:4000
    ports:
      - "${JOBS_FRONTEND_PORT}:3000"
    volumes:
      - jobs_theme_data:/app/.data
    depends_on:
      jobs-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  mysql_marketplace_data:
  mysql_jobs_data:
  redis_data:
  elasticsearch_data:
  marketplace_uploads:
  jobs_uploads:
  marketplace_theme_data:
  jobs_theme_data:
