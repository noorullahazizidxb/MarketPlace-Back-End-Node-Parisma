# =============================================================================
# LOCAL / DEV ONLY — do not use as production edge.
# Production: DevMinds platform (devminds-net + edge public-proxy).
# Public host :80/:443 must stay with edge-gateway-nginx.
# =============================================================================
services:
  # ─── Data tier ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - marketplace-net

  # ─── Application tier ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.docker}"
      REDIS_URL: "redis://redis:6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      ENABLE_ELASTIC_SEARCH: "${ENABLE_ELASTIC_SEARCH:-false}"
      ELASTICSEARCH_NODE: "${ELASTICSEARCH_NODE:-}"
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-}"
      ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD:-}"
      ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX:-listings}"
      ELASTICSEARCH_USERS_INDEX: "${ELASTICSEARCH_USERS_INDEX:-users}"
      ELASTICSEARCH_BLOGS_INDEX: "${ELASTICSEARCH_BLOGS_INDEX:-blogs}"
      ELASTICSEARCH_ALLOW_SELF_SIGNED: "${ELASTICSEARCH_ALLOW_SELF_SIGNED:-true}"
      TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in .env.docker}"
      FRONTEND_URL: "${FRONTEND_URL:-https://marketplace.devminds.net}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@devminds.net}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      WHATSAPP_FROM: "${WHATSAPP_FROM:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.docker}"
      ADMIN_PHONE: "${ADMIN_PHONE:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}"
      # Retention windows
      LISTING_UNAPPROVED_DELETE_AFTER_DAYS: "2"
      LISTING_RENEWAL_WINDOW_DAYS: "14"
      BLOG_STORY_KEEP_DAYS: "30"
      SOLD_RENTED_CLEANUP_DAYS: "90"
      DRAFT_CLEANUP_DAYS: "30"
      FEEDBACK_REMINDER_DAYS: "7"
      BLOG_DEFAULT_EXPIRY_DAYS: "90"
      NOTIFY_BLOG_OWNER_TO_RENEW_DAYS: "7"
      # Scheduled job times (HH:mm, 24h)
      DAILY_LISTING_CLEANUP_TIME: "03:00"
      DAILY_RENEWAL_REMINDER_TIME: "06:00"
      DAILY_BLOG_STORY_CLEANUP_TIME: "04:00"
      DAILY_STATUS_CLEANUP_TIME: "02:00"
      DAILY_RENEWAL_EXPIRE_TIME: "01:00"
      DAILY_FEEDBACK_REMINDER_TIME: "08:00"
      DAILY_BLOG_EXPIRY_CHECK_TIME: "05:00"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/srv/backend/uploads
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - marketplace-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_REPO_URL: "${FRONTEND_REPO_URL:-https://github.com/noorullahazizidxb/MarketPlace-Next-JS.git}"
        FRONTEND_REPO_REF: "${FRONTEND_REPO_REF:-main}"
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-https://api.devminds.net/api}"
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-https://api.devminds.net/api}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-https://api.devminds.net}"
        NEXT_PUBLIC_SOCKET_URL: "${NEXT_PUBLIC_SOCKET_URL:-https://api.devminds.net}"
        NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH: "${NEXT_PUBLIC_ENABLE_ELASTIC_SEARCH:-false}"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
        NEXT_PUBLIC_FACEBOOK_APP_ID: "${NEXT_PUBLIC_FACEBOOK_APP_ID:-}"
        NEXT_PUBLIC_GOOGLE_AUTH_URL: "${NEXT_PUBLIC_GOOGLE_AUTH_URL:-}"
        NEXT_PUBLIC_FACEBOOK_AUTH_URL: "${NEXT_PUBLIC_FACEBOOK_AUTH_URL:-}"
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}"
        BLOG_ORIGIN: "${BLOG_ORIGIN:-}"
        MARKETPLACE_ORIGIN: "${MARKETPLACE_ORIGIN:-}"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - marketplace-net

  # ─── Reverse proxy (LOCAL ONLY — binds loopback so it cannot steal edge :80/:443)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:9088:80"
      - "127.0.0.1:9448:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/www:/var/www/certbot:ro
    networks:
      - marketplace-net

# ─── Networks & Volumes ─────────────────────────────────────────────────────
networks:
  marketplace-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  uploads-data:
